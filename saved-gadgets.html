<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Gadgets | Refecire</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">REFECIRE</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="gadgets.html">Shop</a></li>
      <li><a href="saved-gadgets.html" class="nav-active">Saved</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="login.html" class="sign-in" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>

  <!-- PAGE HEADER -->
  <section class="gadget-hero" style="padding-bottom:1.5rem;">
    <h1>Saved Gadgets</h1>
    <p>Products you saved are stored here. Data persists after page refresh.</p>
  </section>

  <!-- SAVED RESULTS -->
  <section class="gadget-results">

    <!-- COUNT + CLEAR ALL -->
    <div
      style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.75rem;">
      <span class="results-count" id="savedGadgetCount"></span>
      <button class="btn-secondary btn-sm" id="clearAllGadgetsBtn">✕ Clear All</button>
    </div>

    <!-- EMPTY STATE -->
    <div class="saved-empty" id="savedGadgetEmpty" style="display:none;">
      <div class="saved-empty-icon">🛒</div>
      <p>No saved gadgets yet.</p>
      <a href="gadgets.html" class="btn-primary"
        style="display:inline-block;margin-top:1rem;text-decoration:none;padding:0.7rem 1.5rem;border-radius:5px;">Browse
        Gadgets →</a>
    </div>

    <!-- SAVED GRID -->
    <div class="gadget-grid" id="savedGadgetGrid"></div>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Refecire | Saved Gadgets</p>
  </footer>

  <script src="script.js"></script>

</body>

</html>
