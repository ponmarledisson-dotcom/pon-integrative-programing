<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Refecire</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="logo">REFECIRE</div>
    <ul class="nav-links">
      <li><a href="#">About</a></li>
      <li><a href="#">Shop</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <!-- SIGN UP SECTION -->
  <section class="login">
    <div class="login-card">
      <a href="index.html" class="back-btn">← Back</a>

      <h2>Create Account</h2>
      <p>Join Refecire and start shopping</p>

      <form class="login-form" id="signupForm" novalidate>
        <div>
          <input type="text" id="signupName" placeholder="Full Name" />
          <div class="error-message" id="signupNameError"></div>
        </div>

        <div>
          <input type="email" id="signupEmail" placeholder="Email Address" />
          <div class="error-message" id="signupEmailError"></div>
        </div>

        <div>
          <input type="password" id="signupPassword" placeholder="Password" />
          <div class="error-message" id="signupPasswordError"></div>
        </div>

        <div>
          <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" />
          <div class="error-message" id="signupConfirmPasswordError"></div>
        </div>

        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <p class="login-footer">
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Refecire</p>
  </footer>
  <script src="script.js"></script>
</body>

</html>
