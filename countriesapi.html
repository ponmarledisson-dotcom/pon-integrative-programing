<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Explorer | Refecire</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="logo">REFECIRE</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="countries.html" class="nav-active">Countries</a></li>
        <li><a href="login.html" class="sign-in">Sign In</a></li>
      </ul>
    </nav>

    <!-- HERO HEADER -->
    <section class="country-hero">
      <h1>Country Explorer</h1>
      <p>
        Search any country and instantly see its flag, capital, population,
        region, and currency.
      </p>

      <!-- SEARCH BAR -->
      <div class="country-search-wrap">
        <input
          type="text"
          id="countryInput"
          class="country-input"
          placeholder="e.g. Philippines, Japan, Brazil…"
          autocomplete="off"
        />
        <button class="btn-primary country-search-btn" id="searchBtn">
          Search
        </button>
      </div>
      <p class="country-hint">
        Powered by
        <a href="https://restcountries.com" target="_blank"
          >REST Countries API</a
        >
        — free, no key required
      </p>
    </section>

    <!-- RESULTS AREA -->
    <section class="country-results">
      <!-- ERROR STATE -->
      <div class="country-error" id="errorBox" style="display: none">
        <div class="error-icon">⚠</div>
        <p id="errorMsg">Something went wrong.</p>
      </div>

      <!-- LOADING STATE -->
      <div class="country-loading" id="loadingBox" style="display: none">
        <div class="spinner"></div>
        <p>Fetching country data…</p>
      </div>

      <!-- RESULTS GRID -->
      <div class="country-grid" id="countryGrid"></div>
    </section>

    <!-- FOOTER -->
    <footer>
      <p>&copy; 2026 Refecire | Country Explorer</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
